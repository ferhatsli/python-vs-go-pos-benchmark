version: 1
track: A
principles:
  same_schema_indexes: true
  same_transaction_boundaries: true
  same_lock_semantics: true
  same_idempotency_semantics: true
  same_dataset_fingerprint: true
  same_db_connection_budget: 40
  one_api_runtime_per_measured_trial: true
correctness_zero_tolerance:
  - duplicate_successful_payment
  - qr_double_redemption
  - rf_double_spend
  - negative_wallet_balance
  - duplicate_ledger_debit
  - idempotency_mismatch
  - illegal_command_state_transition
  - committed_partial_financial_state
headline_metrics:
  - p50
  - p95
  - p99
  - rps
  - cpu
  - rss
  - db_statements_per_request
  - db_time_per_request
  - transaction_duration
  - pool_wait
  - lock_wait
  - deadlocks
  - postgres_cpu
  - wal_bytes_per_second
