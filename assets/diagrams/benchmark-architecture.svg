<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<title>Benchmark architecture</title>
<desc>The same load and data layer feed one active runtime at a time; metrics and correctness are captured around every trial.</desc>
<metadata>source_csv=docs/architecture.md</metadata>
<rect width="1400" height="760" fill="#0B1117"/>
