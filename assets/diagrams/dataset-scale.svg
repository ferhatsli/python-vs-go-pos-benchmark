<line x1="880.0" y1="350.0" x2="950.0" y2="350.0" stroke="#263443" stroke-width="3"/>
<polygon points="950.0,350.0 939.9,356.4 939.9,343.6" fill="#263443"/>
<text x="70.0" y="595.0" fill="#EAF1F7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Dataset size is not the same thing as k6 VUs or arrival rate.</text>
