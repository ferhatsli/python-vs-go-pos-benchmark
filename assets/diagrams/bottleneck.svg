<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<title>Where the D3 evidence points</title>
<desc>Application request-path saturation is strongly supported; a global database lock-contention explanation is not.</desc>
<metadata>source_csv=results/track-a-20260831/evidence/d3-capacity.json</metadata>
<rect width="1400" height="780" fill="#0B1117"/>
<text x="70" y="72" fill="#EAF1F7" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Where the D3 evidence points</text>
<text x="70" y="108" fill="#A8B6C3" font-family="Arial,Helvetica,sans-serif" font-size="18">Application request-path saturation is strongly supported; a global database lock-contention explanation is not.</text>
<rect x="70.0" y="180.0" width="570.0" height="390.0" rx="14" fill="#111B25"/>
<rect x="70.0" y="180.0" width="8.0" height="390.0" rx="4" fill="#FF6B6B"/>
<text x="98.0" y="222.0" fill="#EAF1F7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Application runtime / request path</text>
<text x="98.0" y="256.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">D3 Heartbeat: Python p95 ~36.4s</text>
<text x="98.0" y="284.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">D3 CARD: Python p95 ~38.1s</text>
<text x="98.0" y="312.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Python API CPU elevated under failure</text>
<text x="98.0" y="340.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Request queueing / pool acquisition are candidates</text>
<text x="98.0" y="368.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Single-process Uvicorn is a Track A confounder</text>
<rect x="760.0" y="180.0" width="570.0" height="390.0" rx="14" fill="#111B25"/>
<rect x="760.0" y="180.0" width="8.0" height="390.0" rx="4" fill="#4DD4AC"/>
<text x="788.0" y="222.0" fill="#EAF1F7" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">PostgreSQL / locking evidence</text>
<text x="788.0" y="256.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Deadlocks: 0 in the highlighted D3 failures</text>
<text x="788.0" y="284.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Observed lock waiters did not explain the failure</text>
<text x="788.0" y="312.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">DB CPU did not establish global DB saturation first</text>
<text x="788.0" y="340.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Connection pressure exists in payment workloads</text>
<text x="788.0" y="368.0" fill="#A8B6C3" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Conclusion: no global lock-contention finding</text>
<line x1="640.0" y1="375.0" x2="760.0" y2="375.0" stroke="#263443" stroke-width="3"/>
<polygon points="760.0,375.0 749.9,381.4 749.9,368.6" fill="#263443"/>
<text x="700.0" y="635.0" fill="#EAF1F7" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Binding bottleneck is workload-specific.</text>
<text x="700.0" y="675.0" fill="#A8B6C3" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Track A does not claim that runtime choice replaces SQL / architecture work.</text>
</svg>
