<text x="70" y="108" fill="#A8B6C3" font-family="Arial,Helvetica,sans-serif" font-size="18">The evidence supports broader Go evaluation, not an automatic full rewrite.</text>
<rect x="110.0" y="185.0" width="1180.0" height="305.0" rx="18" fill="#111B25"/>
