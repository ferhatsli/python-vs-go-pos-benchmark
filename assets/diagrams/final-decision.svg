<text x="700.0" y="285.0" fill="#00ADD8" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700">EVALUATE_BROADER_GO_MIGRATION</text>
<text x="700.0" y="350.0" fill="#EAF1F7" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400">Go materially wins many Track A comparisons while preserving tested correctness.</text>
<text x="700.0" y="392.0" fill="#FFD43B" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">But D3 Worker misses the &lt;5s target in both runtimes.</text>
